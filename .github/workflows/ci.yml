name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run unit tests
        run: npm test
        continue-on-error: false

      - name: Build project
        run: npm run build

      - name: Build API
        run: npm run build:server

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: mysql://viotrack:ci-only@localhost:3306/viotrack_ci
